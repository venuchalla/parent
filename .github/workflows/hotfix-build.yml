name: Hotfix Branch Build

on:
  push:
    branches:
      - hotfix/*

permissions:
  contents: write
  packages: write

jobs:

  hotfix:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java and Maven
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 19
          cache: maven
          server-id: github

      # 3. Configure Git user
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 4. Get hotfix version
      - name: Get Hotfix Version
        id: version
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)
          
          echo "Hotfix version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # 5. Run tests
      - name: Test
        run: |
          mvn test

      # 6. Build application
      - name: Build
        run: |
          mvn clean package -DskipTests

      # 7. Deploy Hotfix RC to GitHub Packages
      - name: Deploy Hotfix RC
        run: |
          mvn deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8. Create status check
      - name: Hotfix Ready for QA
        run: |
          echo "## Hotfix Build Ready" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Ready for QA/Testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Perform QA testing" >> $GITHUB_STEP_SUMMARY
          echo "2. Create Pull Request to \`main\`" >> $GITHUB_STEP_SUMMARY
          echo "3. After merge, tag will be created automatically" >> $GITHUB_STEP_SUMMARY
