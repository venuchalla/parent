name: Develop Snapshot Build

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 19
          cache: maven
          server-id: github

      - name: Configure Git
        run: git config user.name "venuchalla" && git config user.email "venuchalla1993@gmail.com"

      - name: Get Current Version
        id: version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Build and Deploy Snapshot
        run: mvn clean deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Snapshot Deployed
        run: echo "✅ Snapshot ${{ steps.version.outputs.VERSION }} deployed to GitHub Packages"
