name: Develop Snapshot Build

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 19
          cache: maven
          server-id: github

      - name: Determine Base Version
        id: version
        shell: bash
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -n "$TAG" ]; then
            echo "Git tag found: $TAG"

            BASE_VERSION="${TAG#v}"
          else
            echo "No Git tag found. Reading POM version..."

            BASE_VERSION=$(grep -m1 '<version>' pom.xml \
              | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          fi

          VERSION="${BASE_VERSION}-RC0-SNAPSHOT"

          echo "Base version: $BASE_VERSION"
          echo "Build version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set Maven Version
        run: |
          mvn versions:set \
            -DnewVersion="${{ steps.version.outputs.version }}" \
            -DgenerateBackupPoms=false

      - name: Build and Deploy
        run: mvn clean deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Version
        run: |
          echo "✅ Deployed ${{ steps.version.outputs.version }}"
